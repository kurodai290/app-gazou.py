<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マイ フォトギャラリー</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; text-align: center; padding: 20px; }
        h1 { color: #333; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; margin-top: 30px; }
        .gallery-item { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 300px; }
        .gallery-item img { width: 100%; height: auto; border-radius: 4px; object-fit: cover; }
    </style>
</head>
<body>

    <h1>My Photo Gallery</h1>
    <p>お気に入りの画像コレクション</p>

    <div class="gallery">
        <!-- 💡 あなたがアップロードした画像のファイル名に書き換えてください -->
        <div class="gallery-item">
            <img src="photo1.jpg" alt="画像1">
        </div>
        <div class="gallery-item">
            <img src="photo2.jpg" alt="画像2">
        </div>
        <!-- 画像を増やしたい場合は、ここから下をコピーして増やせます -->
    </div>

</body>
</html>
